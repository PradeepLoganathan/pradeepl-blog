<?xml version="1.0" encoding="UTF-8"?>
<!--
  Open Graph social-share image for "Building Trustworthy Agentic AI Systems".
  Render: inkscape og-images/building-trustworthy-agentic-ai-systems.svg \
    -o static/og-images/building-trustworthy-agentic-ai-systems.png -w 1200 -h 630
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0b1220"/>
      <stop offset="55%"  stop-color="#11244a"/>
      <stop offset="100%" stop-color="#1f3b73"/>
    </linearGradient>
    <radialGradient id="glow" cx="950" cy="80" r="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="cover-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="14" result="offsetBlur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- subtle accent strip -->
  <rect x="0" y="0" width="6" height="630" fill="#38bdf8"/>

  <!-- book cover (relative path from this SVG's location) -->
  <image xlink:href="../content/books/building-trustworthy-agentic-ai-systems/building-trustworthy-agentic-ai-systems-book-cover.png"
         x="80" y="65" width="340" height="500"
         preserveAspectRatio="xMidYMid meet"
         filter="url(#cover-shadow)"/>

  <!-- right column text -->
  <g font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#ffffff">
    <!-- eyebrow -->
    <text x="470" y="135" font-size="20" font-weight="600" letter-spacing="3" fill="#38bdf8">
      COMING MAY 2026 · NEW BOOK
    </text>

    <!-- title -->
    <text x="470" y="210" font-size="54" font-weight="800" fill="#ffffff">Building Trustworthy</text>
    <text x="470" y="270" font-size="54" font-weight="800" fill="#ffffff">Agentic AI Systems</text>

    <!-- subtitle -->
    <text x="470" y="335" font-size="24" font-weight="400" fill="#cbd5e1">
      Reliable Multi-Agent Systems
    </text>
    <text x="470" y="368" font-size="24" font-weight="400" fill="#cbd5e1">
      with Java and Akka
    </text>

    <!-- author -->
    <text x="470" y="465" font-size="20" font-weight="500" fill="#94a3b8">
      by Pradeep Loganathan
    </text>

    <!-- footer -->
    <line x1="470" y1="525" x2="1140" y2="525" stroke="#334e7a" stroke-width="1"/>
    <text x="470" y="565" font-size="18" font-weight="500" fill="#94a3b8">
      AI Agents · Multi-Agent Systems · Akka SDK · MCP
    </text>
    <text x="1140" y="565" font-size="18" font-weight="600" fill="#38bdf8" text-anchor="end">
      pradeepl.com
    </text>
  </g>
</svg>
