<?xml version="1.0" encoding="UTF-8"?>
<!--
  Open Graph social-share image for "Serverless On Kubernetes With Knative".
  Render: inkscape og-images/serverless-on-kubernetes-with-knative.svg \
    -o static/og-images/serverless-on-kubernetes-with-knative.png -w 1200 -h 630
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0b1220"/>
      <stop offset="55%"  stop-color="#11244a"/>
      <stop offset="100%" stop-color="#1f3b73"/>
    </linearGradient>
    <radialGradient id="glow" cx="950" cy="80" r="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#34d399" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <filter id="cover-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="14" result="offsetBlur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="0" y="0" width="6" height="630" fill="#34d399"/>

  <image xlink:href="../content/books/serverless-on-kubernetes-with-knative/serverless-on-kubernetes-with-knative.jpg"
         x="80" y="65" width="340" height="500"
         preserveAspectRatio="xMidYMid meet"
         filter="url(#cover-shadow)"/>

  <g font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="470" y="135" font-size="20" font-weight="600" letter-spacing="3" fill="#34d399">
      AVAILABLE NOW · BOOK
    </text>

    <text x="470" y="215" font-size="58" font-weight="800" fill="#ffffff">Serverless on</text>
    <text x="470" y="278" font-size="58" font-weight="800" fill="#ffffff">Kubernetes</text>
    <text x="470" y="341" font-size="58" font-weight="800" fill="#ffffff">with Knative</text>

    <text x="470" y="400" font-size="24" font-weight="400" fill="#cbd5e1">
      Event-driven serverless workloads on K8s
    </text>

    <text x="470" y="465" font-size="20" font-weight="500" fill="#94a3b8">
      by Pradeep Loganathan
    </text>

    <line x1="470" y1="525" x2="1140" y2="525" stroke="#1f4d3a" stroke-width="1"/>
    <text x="470" y="565" font-size="18" font-weight="500" fill="#94a3b8">
      Knative Serving · Eventing · CloudEvents
    </text>
    <text x="1140" y="565" font-size="18" font-weight="600" fill="#34d399" text-anchor="end">
      pradeepl.com
    </text>
  </g>
</svg>
